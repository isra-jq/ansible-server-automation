---
# Tasks for Samba File Sharing on OpenSUSE
- name: Install Samba packages
  community.general.zypper:
    name: "{{ samba_packages }}"
    state: present

- name: Create system group for Samba
  ansible.builtin.group:
    name: "{{ samba_system_group }}"
    state: present

- name: Create system user for Samba
  ansible.builtin.user:
    name: "{{ samba_system_user }}"
    group: "{{ samba_system_group }}"
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create shared directory resource
  ansible.builtin.file:
    path: "{{ samba_share_path }}"
    state: directory
    owner: "{{ samba_system_user }}"
    group: "{{ samba_system_group }}"
    mode: "{{ samba_directory_mask }}"

- name: Check if user exists in Samba database
  ansible.builtin.command:
    cmd: "pdbedit -L -u {{ samba_system_user }}"
  register: samba_user_check
  changed_when: false
  failed_when: false

- name: Create Samba user and set password
  ansible.builtin.shell:
    cmd: >
      (echo "{{ samba_user_password }}"; echo "{{ samba_user_password }}") | smbpasswd -s -a {{ samba_system_user }}
  when: samba_user_check.rc != 0
  no_log: true

- name: Deploy Samba configuration file (smb.conf)
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart smb
    - restart nmb

- name: Open Samba service in firewalld
  ansible.posix.firewalld:
    service: samba
    permanent: true
    state: enabled
    immediate: true
  when: ansible_facts.services['firewalld.service'] is defined or true
  failed_when: false

- name: Ensure Samba services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: "{{ samba_services }}"
