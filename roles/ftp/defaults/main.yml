---
# Defaults for FTP role
ftp_package: vsftpd
ftp_service: vsftpd
ftp_config_file: /etc/vsftpd.conf

ftp_system_user: ftpuser
ftp_user_password: "{{ vault_ftp_user_password | default('FtpSecurePass2026!') }}"
ftp_root_dir: /srv/ftp/shared

ftp_anonymous_enable: "NO"
ftp_local_enable: "YES"
ftp_write_enable: "YES"
ftp_local_umask: "022"
ftp_chroot_local_user: "YES"
ftp_allow_writeable_chroot: "YES"
ftp_pasv_min_port: 40000
ftp_pasv_max_port: 40100
ftp_banner: "Welcome to OpenSUSE 16.0 Automated FTP Server"
