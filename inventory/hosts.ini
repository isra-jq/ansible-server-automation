# ==============================================================================
# Ansible Inventory File
# NOTE: To comply with security best practices, NO plaintext passwords or
# visible credentials are stored in this file.
# Authentication uses SSH Keys or Ansible Vault (group_vars/all/vault.yml).
# ==============================================================================

[opensuse_servers]
# Replace IP with your target OpenSUSE 16.0 host or VM
opensuse-node01 ansible_host=192.168.1.100 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

# Example for additional nodes:
# opensuse-node02 ansible_host=192.168.1.101 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

[lamp_servers]
opensuse-node01

[samba_servers]
opensuse-node01

[ftp_servers]
opensuse-node01

[db_servers]
opensuse-node01

[all:children]
opensuse_servers
lamp_servers
samba_servers
ftp_servers
db_servers
