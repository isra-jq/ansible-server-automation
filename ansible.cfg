[defaults]
# ==============================================================================
# Ansible Configuration - High Performance & Enterprise Best Practices
# Target OS: OpenSUSE 16.0 / Leap
# ==============================================================================

# Default inventory path
inventory = ./inventory/hosts.ini

# Roles path
roles_path = ./roles

# Default remote user (override in inventory or CLI)
remote_user = root

# Host key checking disabled for automated lab/server deployments
host_key_checking = False

# Improve execution time: increase parallel worker forks (default is 5)
forks = 10

# Improve execution time: smart fact gathering (only gather once or when needed)
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 86400

# Retry files disabled to keep repository clean
retry_files_enabled = False

# Output formatting: readable YAML output for stdout
stdout_callback = yaml
bin_ansible_callbacks = True

# Disable deprecation warnings for cleaner automation output
deprecation_warnings = False

# Timeout for SSH connections (in seconds)
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# CRITICAL FOR TIME RESPONSE: SSH Pipelining reduces network round-trips
# (Executes tasks in memory without copying Python modules via SFTP repeatedly)
pipelining = True

# Multiplex SSH connections: reuses open SSH connections for 10 minutes
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

# Path for control sockets
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
